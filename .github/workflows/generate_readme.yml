name: Generate README

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'templates/**'
      - 'src/builder.py'
  pull_request:
    branches:
      - main
    paths:
      - 'data/**'
      - 'templates/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Compile Markdown Tables
        run: |
          python main.py --build --build-internships

      - name: Commit and Push Changes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md INTERNSHIPS.md data/listings.json data/internships.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(readme): automated rebuild of markdown tables [skip ci]" && git push)

